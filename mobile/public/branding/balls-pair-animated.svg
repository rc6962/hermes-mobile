<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" width="660" height="480">
  <defs>
    <radialGradient id="sphere" cx="0.36" cy="0.26" r="0.9">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#e2e8f0"/>
      <stop offset="0.38" stop-color="#93c5fd"/>
      <stop offset="0.62" stop-color="#2563eb"/>
      <stop offset="0.82" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="blueSheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="hard" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- floor shadows -->
  <ellipse cx="215" cy="412" rx="110" ry="12" fill="#000000" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="445" cy="414" rx="92" ry="10" fill="#000000" filter="url(#soft)">
    <animate attributeName="opacity" values="0.5;0.32;0.45;0.38;0.48;0.46" keyTimes="0;0.32;0.47;0.62;0.78;1" dur="1.7s" fill="freeze"/>
  </ellipse>

  <!-- ===== LEFT BALL (sly, bigger, steady) ===== -->
  <g transform="translate(215 250)">
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.6s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="2.2s" begin="2.4s" repeatCount="indefinite" additive="sum"/>
      <circle cx="0" cy="0" r="150" fill="url(#sphere)"/>
      <ellipse cx="83" cy="-36" rx="72" ry="100" fill="url(#blueSheen)" filter="url(#soft)"/>
      <ellipse cx="-47" cy="-80" rx="52" ry="26" fill="#ffffff" opacity="0.85" filter="url(#hard)" transform="rotate(-26 -47 -80)"/>
      <g transform="translate(-196 -184) scale(0.765)">
        <path d="M 162 214 Q 200 196 238 226 Q 200 246 162 214 Z" fill="#05060d" stroke="#cbd5e1" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="188" cy="214" r="6" fill="#ffffff" opacity="0.9"/>
        <path d="M 274 226 Q 312 196 350 214 Q 312 246 274 226 Z" fill="#05060d" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="300" cy="214" r="6" fill="#ffffff" opacity="0.9"/>
        <path d="M 196 304 Q 256 324 314 296" fill="none" stroke="url(#smile)" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- ===== RIGHT BALL (smaller, drops in, bounces, winks) ===== -->
  <g transform="translate(445 262)">
    <!-- entrance drop + settle -->
    <animateTransform attributeName="transform" type="translate" values="0 -430;0 0;0 -28;0 0;0 -8;0 0" keyTimes="0;0.32;0.47;0.62;0.78;1" dur="1.7s" fill="freeze" additive="sum"/>
    <!-- idle bounce loop -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="1.8s" begin="2.6s" repeatCount="indefinite" additive="sum"/>
    <!-- squash & stretch on landing -->
    <g style="transform-origin:0px 0px">
      <animateTransform attributeName="transform" type="scale" values="1;0.8;1;0.92;1;0.97;1" keyTimes="0;0.32;0.47;0.62;0.78;0.9;1" dur="1.7s" fill="freeze" additive="sum"/>
      <circle cx="0" cy="0" r="128" fill="url(#sphere)"/>
      <ellipse cx="56" cy="-33" rx="61" ry="85" fill="url(#blueSheen)" filter="url(#soft)"/>
      <ellipse cx="-71" cy="-74" rx="44" ry="22" fill="#ffffff" opacity="0.85" filter="url(#hard)" transform="rotate(-26 -71 -74)"/>
      <g transform="translate(-167 -157) scale(0.653)">
        <path d="M 162 214 Q 200 196 238 226 Q 200 246 162 214 Z" fill="#05060d" stroke="#cbd5e1" stroke-width="6.5" stroke-linejoin="round"/>
        <circle cx="188" cy="214" r="6.5" fill="#ffffff" opacity="0.9"/>
        <!-- right eye: the winker -->
        <g style="transform-origin:312px 220px">
          <!-- quick double-wink after landing -->
          <animateTransform attributeName="transform" type="scale" values="1 1;1 0.06;1 1;1 0.06;1 1" keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" begin="2.2s" fill="freeze"/>
          <!-- prominent looping wink -->
          <animateTransform attributeName="transform" type="scale" values="1 1;1 0.06;1 1;1 1" keyTimes="0;0.12;0.25;1" dur="3.4s" begin="4.2s" repeatCount="indefinite"/>
          <path d="M 274 226 Q 312 196 350 214 Q 312 246 274 226 Z" fill="#05060d" stroke="#38bdf8" stroke-width="6.5" stroke-linejoin="round"/>
          <circle cx="300" cy="214" r="6.5" fill="#ffffff" opacity="0.9"/>
        </g>
        <path d="M 196 304 Q 256 324 314 296" fill="none" stroke="url(#smile)" stroke-width="7.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
