plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// The workspace filesystem can leave a prior generated build directory
// unreadable after Capacitor cleanup. Keep reproducible app outputs in a fresh,
// ignored directory instead of depending on that stale tree.
buildDir = file("../../.android-build/app")

android {
    namespace = "com.epictechs.balls"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.epictechs.balls"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "0.2.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // Spike M1: arm64-only (S24). Add x86_64 for emulator coverage later.
            abiFilters "arm64-v8a"
        }
        python {
            // Embedded Python (Chaquopy 17): DSL is per product flavor.
            // M1: interpreter only, no packages yet. M2 adds the pinned
            // hermes-agent[web] requirement set.
            buildPython "C:/Users/RickCain/AppData/Local/Python/pythoncore-3.11-64/python.exe"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Keep the web bundle available to Gradle even when a Windows filesystem cannot
// replace Capacitor's generated assets/public directory during `cap sync`.
// Capacitor's local WebView server expects the bundle under assets/public, not
// at the root of the Android assets directory.
def capacitorWebAssetsRoot = file("$buildDir/generated/capacitor-assets")
tasks.register("syncCapacitorWebAssets", Sync) {
    from(file("../../dist")) {
        into "public"
    }
    from(file("$projectDir/src/main/assets")) {
        include "capacitor.config.json"
        include "capacitor.plugins.json"
        include "native-bridge.js"
    }
    into capacitorWebAssetsRoot
}
preBuild.dependsOn(syncCapacitorWebAssets)
android.sourceSets.main.assets.srcDirs = [capacitorWebAssetsRoot]

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
